services:
  # Django Backend
  - type: web
    name: chikitsa-backend
    env: python
    region: oregon
    rootDir: chikitsa_backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chikitsa-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: chikitsa-db
    plan: free
    region: oregon
