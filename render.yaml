services:
  - type: web
    name: chikitsa-backend
    runtime: docker
    region: oregon
    dockerfilePath: ./chikitsa_backend/Dockerfile
    dockerContext: ./chikitsa_backend
    startCommand: >-
      sh -c "python manage.py collectstatic --no-input &&
      python manage.py makemigrations --no-input &&
      python manage.py migrate --no-input &&
      (python manage.py seed_data || true) &&
      gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chikitsa-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEBUG
        value: "False"
      - key: REQUIRE_DOCTOR_VERIFICATION
        value: "True"

databases:
  - name: chikitsa-db
    plan: free
    region: oregon
