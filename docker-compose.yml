services:
  postgres:
    image: postgres:14
    container_name: chikitsa-postgres
    environment:
      POSTGRES_DB: chikitsa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chikitsa-network

  backend:
    build: ./chikitsa_backend
    container_name: chikitsa-backend
    command: >
      sh -c "python manage.py makemigrations --noinput &&
             python manage.py migrate --noinput &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./chikitsa_backend:/chikitsa-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/chikitsa_db
      - DEBUG=True
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chikitsa-network

  frontend:
    build: ./chikitsa_frontend
    container_name: chikitsa-frontend
    volumes:
      - ./chikitsa_frontend:/chikitsa-frontend
      - /chikitsa-frontend/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_API_PROXY_TARGET=http://backend:8000
      - VITE_REQUIRE_DOCTOR_VERIFICATION=${REQUIRE_DOCTOR_VERIFICATION}
    depends_on:
      - backend
    networks:
      - chikitsa-network

volumes:
  postgres_data:

networks:
  chikitsa-network:
    driver: bridge
